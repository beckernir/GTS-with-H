{% extends 'base.html' %}
{% block title %}Reject School Budget{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4>Reject School Budget</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to reject the budget for <strong>{{ budget.school.school_name }}</strong> (Period:
                {{ budget.budget_period.period_name }})?</p>
            <form method="post">{% csrf_token %}
                <button type="submit" class="btn btn-danger">Reject</button>
                <a href="{% url 'budget:school_budget_detail' budget.budget_id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
